<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Smart Learning & Animal Sounds App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            padding: 15px;
            text-align: center;
        }

        header {
            background: #ffffff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            color: #ff4757;
            font-size: 1.8rem;
            margin: 0 auto;
        }

        #back-btn {
            display: none;
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c0392b;
        }

        #back-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .category-card {
            background: white;
            border-radius: 22px;
            padding: 25px 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.12);
            transition: transform 0.15s;
            border: 4px solid #fff;
        }

        .category-card:hover {
            transform: translateY(-5px);
        }

        .cat-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .cat-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2f3542;
        }

        #learning-screen {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }

        #spotlight-box {
            background: white;
            border: 6px solid #ffa502;
            border-radius: 25px;
            max-width: 380px;
            margin: 0 auto 20px auto;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .pop {
            transform: scale(1.08);
        }

        #spot-top {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ff4757;
        }

        #spot-icon {
            font-size: 6rem;
            margin: 5px 0;
        }

        #spot-name {
            font-size: 2rem;
            font-weight: bold;
            color: #1e90ff;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
        }

        .item-btn {
            background: white;
            border: none;
            border-radius: 18px;
            padding: 15px 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #ced6e0;
            transition: all 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-btn:active, .item-btn.active {
            transform: translateY(5px);
            box-shadow: none;
            background: #fff200;
        }

        .item-icon {
            font-size: 2.8rem;
        }

        .item-label {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2f3542;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <button id="back-btn" onclick="goHome()">⬅ वापस (Home)</button>
        <h1 id="page-title">🦁 बच्चों की जादुई पाठशाला 🎵</h1>
    </header>

    <div id="home-screen" class="grid-container"></div>

    <div id="learning-screen">
        <div id="spotlight-box" onclick="repeatAction()">
            <div id="spot-top">A</div>
            <div id="spot-icon">🍎</div>
            <div id="spot-name">Apple</div>
        </div>
        <div id="items-container" class="items-grid"></div>
    </div>

    <script>
        const categories = [
            {
                id: "wild",
                title: "जंगली जानवर (Wild Animals & Roars)",
                icon: "🦁",
                color: "#fadbd8",
                items: [
                    { icon: "🦁", name: "Lion", soundText: "Lion roars! Grrr!", audioUrl: "https://actions.google.com/sounds/v1/animals/lion_roar.ogg" },
                    { icon: "🐯", name: "Tiger", soundText: "Tiger roar! Roar!", audioUrl: "https://actions.google.com/sounds/v1/animals/tiger_roar.ogg" },
                    { icon: "🐘", name: "Elephant", soundText: "Elephant trumpet!", audioUrl: "https://actions.google.com/sounds/v1/animals/elephant_call.ogg" },
                    { icon: "🐺", name: "Wolf", soundText: "Wolf howling!", audioUrl: "https://actions.google.com/sounds/v1/animals/wolf_howling.ogg" },
                    { icon: "🐻", name: "Bear", soundText: "Bear growl!", audioUrl: "https://actions.google.com/sounds/v1/animals/bear_groan.ogg" },
                    { icon: "🐵", name: "Monkey", soundText: "Monkey chatter!", audioUrl: "https://actions.google.com/sounds/v1/animals/monkey_chatter.ogg" }
                ]
            },
            {
                id: "domestic",
                title: "पालतू जानवर (Domestic Animals)",
                icon: "🐄",
                color: "#fcf3cf",
                items: [
                    { icon: "🐶", name: "Dog", soundText: "Dog says Woof Woof!", audioUrl: "https://actions.google.com/sounds/v1/animals/dog_barking.ogg" },
                    { icon: "🐱", name: "Cat", soundText: "Cat says Meow Meow!", audioUrl: "https://actions.google.com/sounds/v1/animals/cat_meow.ogg" },
                    { icon: "🐄", name: "Cow", soundText: "Cow says Moo Moo!", audioUrl: "https://actions.google.com/sounds/v1/animals/cow_mooing.ogg" },
                    { icon: "🐐", name: "Goat", soundText: "Goat says Bleat!", audioUrl: "https://actions.google.com/sounds/v1/animals/goat_bleating.ogg" },
                    { icon: "🐴", name: "Horse", soundText: "Horse neighs!", audioUrl: "https://actions.google.com/sounds/v1/animals/horse_whinny.ogg" },
                    { icon: "🐓", name: "Rooster", soundText: "Rooster says Cock-a-doodle-doo!", audioUrl: "https://actions.google.com/sounds/v1/animals/rooster_crowing.ogg" }
                ]
            },
            {
                id: "abcd",
                title: "ABCD (अक्षर)",
                icon: "🔤",
                color: "#ffcccc",
                items: [
                    { key: "A", icon: "🍎", name: "Apple", soundText: "A for Apple" },
                    { key: "B", icon: "⚽", name: "Ball", soundText: "B for Ball" },
                    { key: "C", icon: "🐱", name: "Cat", soundText: "C for Cat" },
                    { key: "D", icon: "🐶", name: "Dog", soundText: "D for Dog" },
                    { key: "E", icon: "🐘", name: "Elephant", soundText: "E for Elephant" },
                    { key: "F", icon: "🐟", name: "Fish", soundText: "F for Fish" }
                ]
            },
            {
                id: "fruits",
                title: "फल (Fruits)",
                icon: "🍎",
                color: "#ebdef0",
                items: [
                    { icon: "🍎", name: "Apple", soundText: "Apple" },
                    { icon: "🍌", name: "Banana", soundText: "Banana" },
                    { icon: "🥭", name: "Mango", soundText: "Mango" },
                    { icon: "🍊", name: "Orange", soundText: "Orange" },
                    { icon: "🍇", name: "Grapes", soundText: "Grapes" },
                    { icon: "🍉", name: "Watermelon", soundText: "Watermelon" }
                ]
            }
        ];

        let activeCategory = null;
        let lastItem = null;

        const homeScreen = document.getElementById("home-screen");
        const learningScreen = document.getElementById("learning-screen");
        const itemsContainer = document.getElementById("items-container");
        const backBtn = document.getElementById("back-btn");
        const pageTitle = document.getElementById("page-title");

        function renderHome() {
            homeScreen.innerHTML = "";
            categories.forEach(cat => {
                const card = document.createElement("div");
                card.className = "category-card";
                card.style.backgroundColor = cat.color;
                card.innerHTML = `
                    <div class="cat-icon">${cat.icon}</div>
                    <div class="cat-title">${cat.title}</div>
                `;
                card.onclick = () => openCategory(cat);
                homeScreen.appendChild(card);
            });
        }

        function openCategory(cat) {
            activeCategory = cat;
            homeScreen.style.display = "none";
            learningScreen.style.display = "block";
            backBtn.style.display = "inline-block";
            pageTitle.innerText = cat.title;

            itemsContainer.innerHTML = "";
            cat.items.forEach((item, index) => {
                const btn = document.createElement("button");
                btn.className = "item-btn";
                if (item.key) btn.id = "key-" + item.key;
                btn.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-label">${item.key ? item.key + " - " : ""}${item.name}</div>
                `;
                btn.onclick = () => selectItem(item, btn);
                itemsContainer.appendChild(btn);

                if (index === 0) {
                    updateSpotlight(item, false);
                }
            });

            speak(cat.title.split("(")[0]);
        }

        function selectItem(item, btnElement) {
            updateSpotlight(item, true);
            if (btnElement) {
                btnElement.classList.add("active");
                setTimeout(() => btnElement.classList.remove("active"), 200);
            }
            playItemSound(item);
        }

        function updateSpotlight(item, animate) {
            lastItem = item;
            const box = document.getElementById("spotlight-box");
            document.getElementById("spot-top").innerText = item.key || item.name;
            document.getElementById("spot-icon").innerText = item.icon;
            document.getElementById("spot-name").innerText = item.name;

            if (animate) {
                box.classList.remove("pop");
                void box.offsetWidth;
                box.classList.add("pop");
            }
        }

        function playItemSound(item) {
            window.speechSynthesis.cancel();
            
            // अगर जानवर की असली आवाज़ का लिंक है, तो उसे बजाएं
            if (item.audioUrl) {
                const audio = new Audio(item.audioUrl);
                audio.play().catch(e => console.log("Audio play blocked"));
            }

            // साथ में बोलकर भी बताए
            speak(item.soundText);
        }

        function repeatAction() {
            if (lastItem) playItemSound(lastItem);
        }

        function goHome() {
            activeCategory = null;
            learningScreen.style.display = "none";
            homeScreen.style.display = "grid";
            backBtn.style.display = "none";
            pageTitle.innerText = "🦁 बच्चों की जादुई पाठशाला 🎵";
            window.speechSynthesis.cancel();
        }

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-US";
            utterance.rate = 0.85;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        renderHome();
    </script>
</body>
</html>
