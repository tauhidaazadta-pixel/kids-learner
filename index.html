<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8e9">
  <title>Little Learners — Kids Learning App</title>
  <style>
    :root {
      --ink: #25324a;
      --muted: #748099;
      --paper: #fffdf8;
      --bg: #fff8e9;
      --purple: #7657e8;
      --purple-dark: #5c41c5;
      --shadow: 0 12px 30px rgba(58, 51, 92, 0.11);
      --round: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--round);
      background:
        radial-gradient(circle at 8% 10%, #ffe9ab 0 5%, transparent 5.3%),
        radial-gradient(circle at 91% 18%, #dff5ff 0 6%, transparent 6.3%),
        radial-gradient(circle at 90% 87%, #ffe0ed 0 7%, transparent 7.3%),
        var(--bg);
    }

    button { font: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px 22px 48px;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      letter-spacing: -0.5px;
    }

    .brand-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 16px;
      background: #ffe28a;
      box-shadow: 0 5px 0 #f1c95c;
      font-size: 1.7rem;
    }

    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .icon-button {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 5px 0 #e3ddf6;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
    }
    .icon-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #e3ddf6; }
    .icon-button[aria-pressed="false"] { opacity: .5; }

    .nav-button {
      border: 0;
      border-radius: 16px;
      padding: 12px 18px;
      color: white;
      background: var(--purple);
      box-shadow: 0 5px 0 var(--purple-dark);
      font-weight: 800;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .nav-button:hover { transform: translateY(-2px); }
    .nav-button:active {
      transform: translateY(3px) scale(.98);
      box-shadow: 0 2px 0 var(--purple-dark);
    }
    .nav-button:disabled { opacity: .48; cursor: default; transform: none; }

    /* ---------- HOME ---------- */
    .intro { margin: 16px 0 22px; text-align: center; }

    .intro h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.12;
      letter-spacing: -1.5px;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .total-progress {
      display: inline-block;
      margin-top: 12px !important;
      padding: 8px 16px;
      border-radius: 99px;
      background: #fff;
      box-shadow: var(--shadow);
      color: #5c41c5 !important;
      font-size: .92rem !important;
      font-weight: 900 !important;
    }

    .category-grid, .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 16px;
    }

    .category-card, .item-card {
      border: 0;
      color: var(--ink);
      background: var(--paper);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .category-card {
      min-height: 196px;
      padding: 18px 12px 14px;
      border-radius: 24px;
      border-bottom: 5px solid var(--card-color, #e8e4ff);
      text-align: center;
    }

    .category-card:hover, .item-card:hover {
      transform: translateY(-5px) rotate(-1deg);
      box-shadow: 0 17px 32px rgba(58, 51, 92, .16);
    }

    .category-icon {
      display: block;
      margin-bottom: 11px;
      font-size: 3rem;
      line-height: 1.1;
    }

    .category-name { display: block; font-size: 1rem; font-weight: 900; }

    .category-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: .79rem;
      font-weight: 700;
    }

    .category-progress {
      display: block;
      width: 78%;
      height: 7px;
      margin: 12px auto 0;
      border-radius: 99px;
      background: #eee9f7;
      overflow: hidden;
    }
    .category-progress i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #a78bfa, #7657e8);
      transition: width 380ms ease;
    }
    .category-progress-text {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .71rem;
      font-weight: 800;
    }

    /* ---------- LEARN VIEW ---------- */
    .learning-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 26px 0 14px;
    }

    .learning-heading h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.45rem); }

    .keyboard-hint {
      margin: 0;
      color: var(--muted);
      font-size: .88rem;
      font-weight: 700;
      text-align: right;
    }

    .spotlight {
      display: grid;
      grid-template-columns: minmax(110px, 180px) 1fr;
      align-items: center;
      gap: clamp(18px, 5vw, 42px);
      width: 100%;
      min-height: 230px;
      padding: clamp(20px, 5vw, 38px);
      border: 0;
      border-radius: 30px;
      background: linear-gradient(135deg, #fff 0%, #f1edff 100%);
      box-shadow: var(--shadow);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      user-select: none;
      transition: transform 160ms ease;
    }
    .spotlight:active { transform: scale(.995); }

    .spotlight-art {
      display: grid;
      width: clamp(110px, 24vw, 170px);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 32px;
      background: #fff;
      box-shadow: inset 0 0 0 3px #eee9ff, 0 8px 18px rgba(62, 49, 112, .09);
      font-size: clamp(4rem, 12vw, 7rem);
    }

    .spotlight-art .color-dot {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: inset -8px -8px 0 rgba(0,0,0,.08);
    }

    .spotlight-copy small {
      display: inline-block;
      margin-bottom: 8px;
      padding: 6px 12px;
      border-radius: 99px;
      color: var(--purple-dark);
      background: #e8e2ff;
      font-size: .82rem;
      font-weight: 900;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .spotlight-copy h2 {
      margin: 0 0 5px;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1;
    }

    .spotlight-copy p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      font-weight: 700;
    }

    .spotlight-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 11px 18px;
      border: 0;
      border-radius: 99px;
      background: linear-gradient(135deg, #8b6cf6, #6b4ae0);
      color: #fff;
      font-weight: 900;
      font-size: .92rem;
      box-shadow: 0 4px 0 var(--purple-dark);
      cursor: pointer;
      animation: pulse 1.9s ease-in-out infinite;
    }
    .sound-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--purple-dark); animation: none; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }

    .sound-text {
      font-size: 1rem;
      font-weight: 900;
      color: var(--purple-dark);
    }

    .spotlight.pop .spotlight-art {
      animation: pop 420ms cubic-bezier(.2, 1.5, .5, 1);
    }

    @keyframes pop {
      0% { transform: scale(.75) rotate(-8deg); }
      65% { transform: scale(1.12) rotate(4deg); }
      100% { transform: scale(1) rotate(0); }
    }

    /* ---------- ITEM GRID ---------- */
    .items-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 30px 2px 13px;
    }

    .items-title h2 { margin: 0; font-size: 1.3rem; }

    .items-title-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .items-title span {
      color: var(--muted);
      font-size: .87rem;
      font-weight: 700;
    }

    .mini-button {
      border: 0;
      border-radius: 12px;
      padding: 8px 13px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      font-size: .82rem;
      box-shadow: 0 3px 0 #e7e1f7;
      cursor: pointer;
      transition: transform 120ms ease;
    }
    .mini-button:active { transform: translateY(2px); box-shadow: 0 1px 0 #e7e1f7; }

    .item-grid {
      grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
      gap: 12px;
    }

    .item-card {
      position: relative;
      min-height: 120px;
      padding: 13px 9px;
      border-radius: 20px;
      border: 3px solid transparent;
      text-align: center;
    }

    .item-card.selected {
      border-color: var(--purple);
      background: #f3f0ff;
    }

    .learned-badge {
      position: absolute;
      top: 5px;
      right: 7px;
      font-size: .8rem;
      opacity: 0;
      transform: scale(.4);
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .item-card.learned .learned-badge { opacity: 1; transform: scale(1); }

    .item-icon {
      display: grid;
      height: 55px;
      place-items: center;
      margin-bottom: 7px;
      font-size: 2.45rem;
    }

    .item-icon .color-dot {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: inset -5px -5px 0 rgba(0,0,0,.1);
    }

    .item-label { display: block; font-size: .92rem; font-weight: 900; }

    .item-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 700;
    }

    .footer-note {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
    }

    [hidden] { display: none !important; }

    button:focus-visible, .spotlight:focus-visible {
      outline: 4px solid #ffbd4a;
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      .app { padding: 15px 14px 34px; }
      .topbar { margin-bottom: 18px; }
      .brand-mark { width: 42px; height: 42px; }
      .icon-button { width: 42px; height: 42px; }
      .nav-button { padding: 10px 13px; }
      .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .category-card { min-height: 178px; padding: 14px 8px 12px; }
      .category-icon { font-size: 2.5rem; }
      .learning-heading { align-items: start; flex-direction: column; }
      .keyboard-hint { text-align: left; }
      .spotlight {
        grid-template-columns: 96px 1fr;
        min-height: 165px;
        gap: 15px;
        padding: 17px;
        border-radius: 23px;
      }
      .spotlight-art { width: 96px; border-radius: 23px; }
      .spotlight-copy h2 { font-size: 2rem; }
      .spotlight-copy p { font-size: .95rem; }
      .sound-btn { padding: 9px 14px; font-size: .84rem; }
      .item-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
      .item-card { min-height: 108px; padding: 10px 5px; }
      .item-label { font-size: .83rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🌈</span> Little Learners</div>
      <div class="topbar-actions">
        <button id="soundToggle" class="icon-button" type="button" aria-pressed="true" title="आवाज़ चालू / बंद">🔊</button>
        <button id="homeButton" class="nav-button" type="button" disabled>🏠 Home / वापस</button>
      </div>
    </header>

    <section id="homeView">
      <div class="intro">
        <h1>चलो सीखें! <span aria-hidden="true">✨</span></h1>
        <p>अपना पसंदीदा विषय चुनें और सीखना शुरू करें।</p>
        <p id="totalProgress" class="total-progress"></p>
      </div>
      <div id="categoryGrid" class="category-grid" aria-label="Learning categories"></div>
    </section>

    <section id="learnView" hidden>
      <div class="learning-heading">
        <h1 id="categoryTitle"></h1>
        <p class="keyboard-hint">⌨️ A–Z अक्षर • 1–9 आइटम • S आवाज़ • R रैंडम • Esc वापस</p>
      </div>

      <div id="spotlight" class="spotlight" role="button" tabindex="0" aria-label="Repeat pronunciation">
        <div id="spotlightArt" class="spotlight-art" aria-hidden="true"></div>
        <div class="spotlight-copy">
          <small id="spotlightTag"></small>
          <h2 id="spotlightName"></h2>
          <p id="spotlightDetail"></p>
          <div class="spotlight-actions">
            <button id="soundButton" class="sound-btn" type="button" hidden>🔊 आवाज़ सुनें</button>
            <span id="spotlightSoundText" class="sound-text"></span>
          </div>
        </div>
      </div>

      <div class="items-title">
        <h2>आइए, चुनकर सीखें!</h2>
        <div class="items-title-right">
          <span id="itemCount"></span>
          <button id="randomButton" class="mini-button" type="button">🎲 रैंडम</button>
        </div>
      </div>
      <div id="itemGrid" class="item-grid" aria-label="Items in this category"></div>
    </section>

    <p class="footer-note">🌟 सीखना मज़ेदार है — हर दिन कुछ नया सीखें! 🌟</p>
  </main>

  <script>
    /* =========================================================
       1. HELPERS FOR BUILDING ITEM LISTS
       ========================================================= */
    // [tag, name, detail, icon, swatch?]
    const plainItems = rows => rows.map(([tag, name, detail, icon, swatch]) => ({
      tag, name, detail, icon, swatch, spoken: detail
    }));

    // [name, detail, icon, soundKey?, soundWord?]
    const soundItems = rows => rows.map(([name, detail, icon, snd, sound]) => ({
      tag: icon, name, detail, icon, snd, sound,
      spoken: name + ". " + detail
    }));

    /* =========================================================
       2. CATEGORY DATA
       ========================================================= */
    const categories = [
      {
        id: "letters", title: "ABCD", subtitle: "अक्षर • Letters", icon: "🔤", color: "#ffd8e4",
        items: plainItems([
          ["A", "Apple", "A for Apple", "🍎"], ["B", "Ball", "B for Ball", "⚽"],
          ["C", "Cat", "C for Cat", "🐱"], ["D", "Dog", "D for Dog", "🐶"],
          ["E", "Elephant", "E for Elephant", "🐘"], ["F", "Fish", "F for Fish", "🐟"],
          ["G", "Grapes", "G for Grapes", "🍇"], ["H", "Hat", "H for Hat", "🎩"],
          ["I", "Ice Cream", "I for Ice Cream", "🍦"], ["J", "Juice", "J for Juice", "🧃"],
          ["K", "Kite", "K for Kite", "🪁"], ["L", "Lion", "L for Lion", "🦁"],
          ["M", "Moon", "M for Moon", "🌙"], ["N", "Nest", "N for Nest", "🪺"],
          ["O", "Orange", "O for Orange", "🍊"], ["P", "Penguin", "P for Penguin", "🐧"],
          ["Q", "Queen", "Q for Queen", "👑"], ["R", "Rabbit", "R for Rabbit", "🐰"],
          ["S", "Sun", "S for Sun", "☀️"], ["T", "Tiger", "T for Tiger", "🐯"],
          ["U", "Umbrella", "U for Umbrella", "☂️"], ["V", "Violin", "V for Violin", "🎻"],
          ["W", "Whale", "W for Whale", "🐳"], ["X", "Xylophone", "X for Xylophone", "🎼"],
          ["Y", "Yo-yo", "Y for Yo-yo", "🪀"], ["Z", "Zebra", "Z for Zebra", "🦓"]
        ])
      },
      {
        id: "numbers", title: "123", subtitle: "गिनती • Counting", icon: "🔢", color: "#d8efff",
        items: plainItems([
          ["1", "One", "1 — One", "☝️"], ["2", "Two", "2 — Two", "✌️"],
          ["3", "Three", "3 — Three", "🤟"], ["4", "Four", "4 — Four", "🍀"],
          ["5", "Five", "5 — Five", "🖐️"], ["6", "Six", "6 — Six", "🎲"],
          ["7", "Seven", "7 — Seven", "🌈"], ["8", "Eight", "8 — Eight", "🐙"],
          ["9", "Nine", "9 — Nine", "🎈"], ["10", "Ten", "10 — Ten", "🔟"],
          ["11", "Eleven", "11 — Eleven", "⭐"], ["12", "Twelve", "12 — Twelve", "🥚"],
          ["13", "Thirteen", "13 — Thirteen", "🦋"], ["14", "Fourteen", "14 — Fourteen", "🌷"],
          ["15", "Fifteen", "15 — Fifteen", "🍓"], ["16", "Sixteen", "16 — Sixteen", "🎨"],
          ["17", "Seventeen", "17 — Seventeen", "🐞"], ["18", "Eighteen", "18 — Eighteen", "🌼"],
          ["19", "Nineteen", "19 — Nineteen", "🧸"], ["20", "Twenty", "20 — Twenty", "🎉"]
        ])
      },
      {
        id: "pets", title: "Domestic Animals", subtitle: "पालतू जानवर", icon: "🐕", color: "#e5f6d5",
        items: soundItems([
          ["Dog", "A friendly pet that says woof!", "🐶", "bark", "Woof woof!"],
          ["Cat", "A soft pet that says meow!", "🐱", "meow", "Meow!"],
          ["Cow", "A farm animal that gives us milk.", "🐮", "moo", "Mooooo!"],
          ["Goat", "A lively animal that likes to nibble.", "🐐", "bleat", "Maa maa!"],
          ["Sheep", "A fluffy animal with soft wool.", "🐑", "baa", "Baa baa!"],
          ["Horse", "A strong animal that can run fast.", "🐴", "neigh", "Neigh!"],
          ["Rabbit", "A small animal with long ears.", "🐰", "squeak", "Squeak squeak!"],
          ["Hamster", "A tiny, furry pet.", "🐹", "squeak", "Squeak!"],
          ["Turtle", "A gentle pet with a hard shell.", "🐢", "hiss", "Hssss..."],
          ["Goldfish", "A little fish that swims in water.", "🐟", "blub", "Blub blub!"]
        ])
      },
      {
        id: "wild", title: "Wild Animals", subtitle: "जंगली जानवर", icon: "🦁", color: "#ffe2bd",
        items: soundItems([
          ["Lion", "The lion is known as the king of the jungle.", "🦁", "roar", "Roooaaar!"],
          ["Tiger", "A big cat with beautiful stripes.", "🐯", "growl", "Grrrrr!"],

          ["Bear", "A strong, furry animal.", "🐻", "growl", "Grrrrr!"],

          ["Crocodile", "A reptile that lives near water.", "🐊", "snap", "Snap snap!"],
          ["Hippopotamus", "A large animal that likes the water.", "🦛", "grumble", "Grumble grumble!"]
        ])
      },
      {
        id: "birds", title: "Birds", subtitle: "पक्षी", icon: "🐦", color: "#d9edff",
        items: soundItems([
          ["Bird", "Birds have feathers and wings.", "🐦", "tweet", "Tweet tweet!"],
          ["Parrot", "A colorful bird that can copy sounds.", "🦜", "squawk", "Squawk!"],
          ["Peacock", "A beautiful bird with a colorful tail.", "🦚", "peacock", "May-aww!"],
          ["Duck", "A bird that likes to swim.", "🦆", "quack", "Quack quack!"],

          ["Eagle", "A strong bird that soars high in the sky.", "🦅", "screech", "Screeee!"],
          ["Rooster", "A rooster wakes up early and crows.", "🐓", "rooster", "Cock-a-doodle-doo!"],
          ["Swan", "A graceful bird that swims on lakes.", "🦢", "hiss", "Hssss..."],
          ["Penguin", "A bird that swims but cannot fly.", "🐧", "honk", "Honk honk!"],
          ["Flamingo", "A tall, pink bird that stands on one leg.", "🦩", "honk", "Honk!"]
        ])
      },
      {
        id: "insects", title: "Insects", subtitle: "कीड़े-मकोड़े", icon: "🐛", color: "#ffeec2",
        items: soundItems([
          ["Bee", "Bees buzz around flowers and make honey.", "🐝", "buzz", "Buzzzzz!"],
          ["Cricket", "Crickets chirp sweetly at night.", "🦗", "chirp", "Chirp chirp!"],
          ["Mosquito", "Mosquitoes buzz near our ears.", "🦟", "mosquito", "Zzzzzzz!"],

    /* =========================================================
       3. SOUND ENGINE  (Web Audio API — no files needed!)
       ========================================================= */
    const SOUNDS = {

    let audioCtx = null;

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playNotes(notes) {
      if (!soundOn || !notes) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const start = ctx.currentTime + 0.02;

      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t0 = start + (n.t || 0);
        const dur = n.d || 0.2;

        osc.type = n.type || "sine";
        osc.frequency.setValueAtTime(Math.max(20, n.f), t0);
        if (n.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, n.f2), t0 + dur);

        if (n.vib) {
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value = n.vib;
          lfoGain.gain.value = n.vibDepth || 20;
          lfo.connect(lfoGain).connect(osc.frequency);
          lfo.start(t0);
          lfo.stop(t0 + dur + 0.05);
        }

        const peak = n.gain ?? 0.18;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.03, dur / 3));
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        osc.connect(gain).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
      });
    }

    /* =========================================================
       4. SPEECH
       ========================================================= */
    let soundOn = true;
    let speechToken = 0;

    function speakText(text, onEnd) {
      if (!("speechSynthesis" in window) || !soundOn || !text) {
        if (onEnd) onEnd();
        return;
      }
      window.speechSynthesis.cancel();
      const token = ++speechToken;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 0.86;
      utterance.pitch = 1.08;
      utterance.onend = () => {
        if (token === speechToken && onEnd) onEnd();
      };
      window.speechSynthesis.speak(utterance);
    }

    /* =========================================================
       5. DOM REFERENCES
       ========================================================= */
    const homeView = document.getElementById("homeView");
    const learnView = document.getElementById("learnView");
    const categoryGrid = document.getElementById("categoryGrid");
    const itemGrid = document.getElementById("itemGrid");
    const homeButton = document.getElementById("homeButton");
    const soundToggle = document.getElementById("soundToggle");
    const randomButton = document.getElementById("randomButton");
    const categoryTitle = document.getElementById("categoryTitle");
    const spotlight = document.getElementById("spotlight");
    const spotlightArt = document.getElementById("spotlightArt");
    const spotlightTag = document.getElementById("spotlightTag");
    const spotlightName = document.getElementById("spotlightName");
    const spotlightDetail = document.getElementById("spotlightDetail");
    const soundButton = document.getElementById("soundButton");
    const spotlightSoundText = document.getElementById("spotlightSoundText");
    const itemCount = document.getElementById("itemCount");
    const totalProgress = document.getElementById("totalProgress");

    let activeCategory = null;
    let selectedIndex = 0;

    /* =========================================================
       6. PROGRESS (localStorage)
       ========================================================= */
    let progress = {};
    try {
      progress = JSON.parse(localStorage.getItem("ll-progress") || "{}") || {};
    } catch (e) {
      progress = {};
    }

    function saveProgress() {
      try {
        localStorage.setItem("ll-progress", JSON.stringify(progress));
      } catch (e) { /* ignore */ }
    }

    function markLearned(catId, index) {
      if (!progress[catId]) progress[catId] = [];
      if (!progress[catId].includes(index)) {
        progress[catId].push(index);
        saveProgress();
        updateCategoryProgress(catId);
        updateTotalProgress();
      }
      const card = itemGrid.querySelector('[data-index="' + index + '"]');
      if (card) card.classList.add("learned");
    }

    function updateCategoryProgress(catId) {
      const card = categoryGrid.querySelector('[data-category="' + catId + '"]');
      const cat = categories.find(c => c.id === catId);
      if (!card || !cat) return;

      const learned = (progress[catId] || []).length;
      const pct = Math.round((learned / cat.items.length) * 100);

      const bar = card.querySelector(".category-progress i");
      const txt = card.querySelector(".category-progress-text");

      if (bar) bar.style.width = pct + "%";
      if (txt) {
        txt.textContent = learned
          ? learned + "/" + cat.items.length + " सीखे ⭐"
          : cat.items.length + " आइटम";
      }
    }

    function updateTotalProgress() {
      const total = categories.reduce((sum, c) => sum + c.items.length, 0);
      const learned = categories.reduce((sum, c) => sum + (progress[c.id] || []).length, 0);
      totalProgress.textContent = learned
        ? "🎯 आपने अब तक " + learned + " / " + total + " चीज़ें सीखीं!"
        : "🎯 कुल " + total + " चीज़ें सीखने को मिलेंगी!";
    }

    /* =========================================================
       7. RENDERING
       ========================================================= */
    function makeArt(item, className) {
      if (item.swatch) {
        return '<span class="' + className + '"><span class="color-dot" style="--swatch:' + item.swatch + '"></span></span>';
      }
      return '<span class="' + className + '">' + item.icon + '</span>';
    }

    function renderCategories() {
      categoryGrid.innerHTML = categories.map(category => {
        const learned = (progress[category.id] || []).length;
        const pct = Math.round((learned / category.items.length) * 100);

        return `
          <button class="category-card" type="button"
            style="--card-color:${category.color}" data-category="${category.id}">
            <span class="category-icon" aria-hidden="true">${category.icon}</span>
            <span class="category-name">${category.title}</span>
            <span class="category-subtitle">${category.subtitle}</span>
            <span class="category-progress"><i style="width:${pct}%"></i></span>
            <span class="category-progress-text">
              ${learned ? learned + "/" + category.items.length + " सीखे ⭐" : category.items.length + " आइटम"}
            </span>
          </button>`;
      }).join("");

      categoryGrid.querySelectorAll("[data-category]").forEach(button => {
        button.addEventListener("click", () => openCategory(button.dataset.category));
      });
    }

    function openCategory(id) {
      activeCategory = categories.find(category => category.id === id);
      if (!activeCategory) return;

      selectedIndex = 0;
      homeView.hidden = true;
      learnView.hidden = false;
      homeButton.disabled = false;
      categoryTitle.textContent = activeCategory.icon + " " + activeCategory.title + " · " + activeCategory.subtitle;
      itemCount.textContent = activeCategory.items.length + " आइटम";
      renderItems();
      selectItem(0, true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderItems() {
      const learnedList = progress[activeCategory.id] || [];

      itemGrid.innerHTML = activeCategory.items.map((item, index) => {
        const learned = learnedList.includes(index);
        return `
          <button class="item-card${learned ? " learned" : ""}" type="button" data-index="${index}"
            aria-label="${item.name}">
            <span class="learned-badge" aria-hidden="true">⭐</span>
            ${makeArt(item, "item-icon")}
            <span class="item-label">${item.name}</span>
            <span class="item-sub">${item.tag}</span>
          </button>`;
      }).join("");

      itemGrid.querySelectorAll("[data-index]").forEach(button => {
        button.addEventListener("click", () => selectItem(Number(button.dataset.index), true));
      });
    }

    function selectItem(index, shouldSpeak) {
      if (!activeCategory || index < 0 || index >= activeCategory.items.length) return;

      selectedIndex = index;
      const item = activeCategory.items[index];

      spotlightArt.innerHTML = item.swatch
        ? '<span class="color-dot" style="--swatch:' + item.swatch + '"></span>'
        : item.icon;
      spotlightTag.textContent = item.tag;
      spotlightName.textContent = item.name;
      spotlightDetail.textContent = item.detail;
      spotlight.setAttribute("aria-label", "Play pronunciation: " + (item.spoken || item.name));

      if (item.snd) {
        soundButton.hidden = false;
        spotlightSoundText.textContent = item.sound || "";
      } else {
        soundButton.hidden = true;
        spotlightSoundText.textContent = "";
      }

      itemGrid.querySelectorAll(".item-card").forEach((button, buttonIndex) => {
        const isSelected = buttonIndex === index;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });

      spotlight.classList.remove("pop");
      void spotlight.offsetWidth;
      spotlight.classList.add("pop");

      if (shouldSpeak) {
        markLearned(activeCategory.id, index);
        speakText(item.spoken || item.name, () => {
          if (item.snd) playNotes(SOUNDS[item.snd]);
        });
      }
    }

    function playCurrentSound() {
      if (!activeCategory) return;
      const item = activeCategory.items[selectedIndex];
      if (!item || !item.snd) return;

      playNotes(SOUNDS[item.snd]);
      if (item.sound) {
        setTimeout(() => speakText(item.sound), 550);
      }
    }

    function pickRandom() {
      if (!activeCategory) return;
      const index = Math.floor(Math.random() * activeCategory.items.length);
      selectItem(index, true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      activeCategory = null;
      learnView.hidden = true;
      homeView.hidden = false;
      homeButton.disabled = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* =========================================================
       8. EVENTS
       ========================================================= */
    homeButton.addEventListener("click", goHome);
    randomButton.addEventListener("click", pickRandom);

    // Tap the big card → say the name again
    spotlight.addEventListener("click", event => {
      if (event.target.closest("#soundButton")) return;
      if (activeCategory) speakText(activeCategory.items[selectedIndex].spoken || activeCategory.items[selectedIndex].name);
    });

    // Keyboard activation for the big card
    spotlight.addEventListener("keydown", event => {
      if (event.target !== spotlight) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        if (activeCategory) speakText(activeCategory.items[selectedIndex].spoken || activeCategory.items[selectedIndex].name);
      }
    });

    // Sound button → play the animal / vehicle / insect sound
    soundButton.addEventListener("click", event => {
      event.stopPropagation();
      playCurrentSound();
    });

    // Mute / unmute everything
    soundToggle.addEventListener("click", () => {
      soundOn = !soundOn;
      soundToggle.textContent = soundOn ? "🔊" : "🔇";
      soundToggle.setAttribute("aria-pressed", String(soundOn));
      if (!soundOn && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", event => {
      if (!activeCategory || event.ctrlKey || event.metaKey || event.altKey) return;

      const key = event.key;
      const lower = key.toLowerCase();

      if (activeCategory.id === "letters" && /^[a-z]$/.test(lower)) {
        selectItem(lower.charCodeAt(0) - 97, true);
        return;
      }

      if (/^[0-9]$/.test(key)) {
        const number = Number(key);
        if (number === 0) {
          if (activeCategory.items.length >= 10) selectItem(9, true);
        } else {
          selectItem(number - 1, true);
        }
        return;
      }

      if (lower === "s") {
        event.preventDefault();
        playCurrentSound();
        return;
      }

      if (lower === "r") {
        event.preventDefault();
        pickRandom();
        return;
      }

      if (key === "Escape" || key === "Backspace") {
        event.preventDefault();
        goHome();
      }
    });

    /* =========================================================
       9. INIT
       ========================================================= */
    renderCategories();
    updateTotalProgress();
  </script>
